name: Configuration checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  helpers:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native agent tree patch packaging, scope and privacy
        run: node --test tests/agent-tree.test.mjs
      - name: Mocked spawning, presets, notes, branding and usage regressions
        run: node --test tests/spawn-agent.test.mjs tests/workspace-preset.test.mjs tests/workspace-notes.test.mjs tests/branding.test.mjs tests/attention-profile.test.mjs tests/focus-keys.test.mjs tests/desktop-notifications.test.mjs plugins/neura-usage/usage-report.test.mjs
      - name: Parse optional patch verification helper
        if: runner.os == 'Linux'
        run: |
          bash -n tools/test-fx-herdr-state.sh
          git apply --numstat patches/fx-herdr-resume-v0.0.13.patch
          git apply --numstat patches/windows-wsl-image-paste-v0.9.3.patch
      - name: Parse PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Windows PowerShell helper and installer regressions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell.exe -NoProfile -File tests/rename-context.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -File tests/cockpit-attention.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -File tests/cockpit-identity.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -File tests/cockpit-integrations.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -File tests/worker-launcher.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -File tests/install-link.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
