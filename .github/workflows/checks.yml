name: Configuration checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  helpers:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mocked spawning and usage regressions
        run: node --test tests/spawn-agent.test.mjs plugins/neura-usage/usage-report.test.mjs
      - name: Windows PowerShell rename regressions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell.exe -NoProfile -File tests/rename-context.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
