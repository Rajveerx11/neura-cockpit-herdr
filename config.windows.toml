rows = [
  ["state_icon", { token = "workspace", fg = "#ffffff", bold = true }, "state_text"],
  [{ token = "branch", fg = "#ff55ff" }, "git_status"],
]

[ui.toast]
delivery = "herdr"
delay_seconds = 2

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[ui.sound]
enabled = false

[session]
resume_agents_on_restore = true

[update]
channel = "stable"
